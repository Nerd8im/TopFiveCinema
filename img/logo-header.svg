<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1488 468" role="img" aria-label="TopFive Cinema" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>TopFive Cinema</title>
<defs>
  <!-- Contorno branco: engorda a silhueta do logo (dilate), pinta de branco e coloca o logo original por cima -->
  <filter id="contornoBranco" x="-5%" y="-10%" width="110%" height="120%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="engrossado"/>
    <feFlood flood-color="#FFFFFF" result="branco"/>
    <feComposite in="branco" in2="engrossado" operator="in" result="contorno"/>
    <feMerge>
      <feMergeNode in="contorno"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<g filter="url(#contornoBranco)">


